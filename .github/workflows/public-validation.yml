name: Hosted integrity verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-validation:
    name: public-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out exact untrusted revision without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Select exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: ""

      - name: Enforce public-CI trust contract
        run: python tools/ci/verify_public_ci.py --root .

      - name: Install hash-locked verification dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes --requirement requirements.ci.lock"

      - name: Verify exact source, local certification closure, and cheap predicates
        if: github.event_name != 'pull_request'
        run: python tools/ci/verify_local_certification.py --root . --expected-envelope-sha "$GITHUB_SHA"

      - name: Validate schemas, fixtures, identifiers, and trust boundaries
        run: |
          python -m pip check
          python schemas/tooling/python/run.py validate-repository
          python schemas/tooling/python/run.py verify-fixtures
          python tools/oracle/compile_oracle_foundation.py --check --bounded
          python tools/oracle/compile_evidence_admissibility.py --check --bounded
          python tools/applicability/compile_conditional_applicability.py --check --bounded
          python tools/adjudication/compile_adjudication.py --check --bounded
          python tools/ci/verify_repository_identifier_hygiene.py --root .
          python -m unittest discover -s tests/ci -v

      - name: Prove bounded verifier smoke behavior and repository immutability
        run: |
          python -m unittest tests.ci.test_local_certification -v
          git diff --exit-code
